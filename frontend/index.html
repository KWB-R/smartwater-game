    <!-- Boot-Loader: gleiches Layout wie FullscreenLoadingScreen, vor JS/CSS-Bundle. -->
    <style>
      html,
      body {
        margin: 0;
        background: #f9f3f0;
      }
      .boot-loading {
        position: fixed;
        inset: 0;
        z-index: 1000001;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background: #f9f3f0;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem
          max(1.25rem, env(safe-area-inset-bottom));
      }
      .boot-loading__wrap {
        position: relative;
        width: 100%;
        max-width: min(100%, 25rem);
        /* Platz für Mascot oberhalb der Card-Kante (w-40 ≈ 10rem) */
        padding-top: 10rem;
      }
      .boot-loading__card {
        position: relative;
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        border-radius: 0.75rem;
        background: #fff;
        padding: 1.25rem 1.5rem;
        text-align: center;
      }
      .boot-loading__mascot {
        position: absolute;
        left: 50%;
        top: 0;
        z-index: 1;
        width: 10rem;
        height: auto;
        transform: translate(-50%, -95%);
        pointer-events: none;
        user-select: none;
      }
      .boot-loading__label {
        margin: 0;
        font-family:
          "Right Grotesk",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.15;
        color: #375172;
      }
      .boot-loading__track {
        margin-top: 1rem;
        height: 0.5rem;
        width: 100%;
        overflow: hidden;
        border-radius: 9999px;
        background: #f9f3f0;
      }
      .boot-loading__bar {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: 9999px;
        background: #7de3a9;
        animation: boot-loading-scan 1.05s ease-in-out infinite;
      }
      @keyframes boot-loading-scan {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading__bar {
          animation: none;
          transform: translateX(70%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-live="polite">
        <div class="boot-loading__wrap">
          <div class="boot-loading__card">
            <img
              class="boot-loading__mascot"
              src="/waiting_1_animated.svg"
              alt=""
              aria-hidden="true"
              width="160"
              height="154"
              draggable="false"
            />
            <p class="boot-loading__label">Inhalte werden geladen</p>
            <div
              class="boot-loading__track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuetext="Laden …"
              aria-label="Ladefortschritt"
            >
              <span class="boot-loading__bar"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
